# M3 of the family in docs/FUSION.md section 10: the hybrid, with the ball-state evidence taken from
# a LightGBM trained on IDSSE matches whose ball is lost as automatic tracking loses it (regime
# "mix_lf", possession/regime.py). The team evidence stays that of version 1.
name = "hybrid_regime_mix"

[ball_state]
method = "blend"
sources = [{ method = "supervised", regime = "mix_lf" }, "kickoff_wait"]

[team]
method = "blend"
sources = ["supervised"]

[decode]
method = "switch_cost"
turnover_cost = 5.0
stop_cost = 12.0
restart_cost = 12.0
snap_start_s = 3.0
snap_end_s = 3.0
