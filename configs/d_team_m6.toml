# Task 14, team features: the ball-state evidence of M6 (the temporal network, plus the kick-off
# rule; configs/hybrid_sequence.toml) with the team evidence of the supervised model with the team
# feature block (feature set "v1+team", see configs/d_team.toml). Decoder as version 1.
name = "d_team_m6"

[ball_state]
method = "blend"
sources = ["sequence", "kickoff_wait"]

[team]
method = "blend"
sources = [{ method = "supervised", features = "v1+team" }]

[decode]
method = "switch_cost"
turnover_cost = 5.0
stop_cost = 12.0
restart_cost = 12.0
snap_start_s = 3.0
snap_end_s = 3.0
