# Task 14, direction F1: V1 ball state; team evidence: LightGBM and the temporal network's team head at 1 / 1.
# The temporal network is the committed one of task 13 (models/sequence/); nothing is trained here.
name = "f1_blend11"

[ball_state]
method = "blend"
sources = ["supervised", "kickoff_wait"]

[team]
method = "blend"
sources = ["supervised", "sequence"]
weights = [1.0, 1.0]

[decode]
method = "switch_cost"
turnover_cost = 5.0
stop_cost = 12.0
restart_cost = 12.0
snap_start_s = 3.0
snap_end_s = 3.0
