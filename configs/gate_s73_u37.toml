# Task 14: ball state from V1's LightGBM and the temporal network, weighted by ball visibility
# (tracked ball: [0.7, 0.3]; no ball: [0.3, 0.7]); team evidence and decoder of V1.
name = "gate_s73_u37"

[ball_state]
method = "blend_by_ball"
sources = ["supervised", "sequence", "kickoff_wait"]
weights_seen = [0.7, 0.3, 1.0]
weights_unseen = [0.3, 0.7, 1.0]

[team]
method = "blend"
sources = ["supervised"]

[decode]
method = "switch_cost"
turnover_cost = 5.0
stop_cost = 12.0
restart_cost = 12.0
snap_start_s = 3.0
snap_end_s = 3.0
