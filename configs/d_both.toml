# Task 14, team features: both stages from the supervised model with the team feature block
# (feature set "v1+team", see configs/d_team.toml), plus version 1's kick-off rule and decoder.
name = "d_both"

[ball_state]
method = "blend"
sources = [{ method = "supervised", features = "v1+team" }, "kickoff_wait"]

[team]
method = "blend"
sources = [{ method = "supervised", features = "v1+team" }]

[decode]
method = "switch_cost"
turnover_cost = 5.0
stop_cost = 12.0
restart_cost = 12.0
snap_start_s = 3.0
snap_end_s = 3.0
