# Task 14, direction F1: M6 ball state; team evidence from the temporal network's team head alone.
# The temporal network is the committed one of task 13 (models/sequence/); nothing is trained here.
name = "f1_m6_seqteam"

[ball_state]
method = "blend"
sources = ["sequence", "kickoff_wait"]

[team]
method = "blend"
sources = ["sequence"]

[decode]
method = "switch_cost"
turnover_cost = 5.0
stop_cost = 12.0
restart_cost = 12.0
snap_start_s = 3.0
snap_end_s = 3.0
