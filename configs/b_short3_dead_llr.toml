# Task 14, decoder options (scripts/decoder_grid14.py): version 1, spells under 3 s between two of the other team -> dead, only where the mean |team log-odds| is below 2.2 (odds of 9 to 1)
name = "b_short3_dead_llr"

[ball_state]
method = "blend"
sources = ["supervised", "kickoff_wait"]

[team]
method = "blend"
sources = ["supervised"]

[decode]
method = "switch_cost"
turnover_cost = 5.0
stop_cost = 12.0
restart_cost = 12.0
snap_start_s = 3.0
snap_end_s = 3.0
short_spell_s = 3.0
short_spell_policy = "dead"
short_spell_max_llr = 2.2
