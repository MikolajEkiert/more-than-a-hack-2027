# Task 14 bundle candidate: M6's ball state (temporal network + kick-off rule), team evidence
# averaged from V1's LightGBM and the mixed-regime LightGBM (0.5 / 0.5), and the decoder of
# b_bundle_m6 (stoppage start snapped to the tracked ball's line exit within 6 s, stoppage plus
# restart cost 28).
name = "c14_full"

[ball_state]
method = "blend"
sources = ["sequence", "kickoff_wait"]

[team]
method = "blend"
sources = ["supervised", { method = "supervised", regime = "mix_lf" }]
weights = [0.5, 0.5]

[decode]
method = "switch_cost"
turnover_cost = 5.0
stop_cost = 16.0
restart_cost = 12.0
snap_start_s = 3.0
snap_end_s = 3.0
line_snap_s = 6.0
line_margin_m = 0.5
