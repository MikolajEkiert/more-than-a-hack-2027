# Task 14, decoder options (scripts/decoder_grid14.py): the decoder of b_bundle on top of M6
# (configs/hybrid_sequence.toml: the temporal network's ball-state evidence plus the kick-off rule,
# the team evidence of version 1).
name = "b_bundle_m6"

[ball_state]
method = "blend"
sources = ["sequence", "kickoff_wait"]

[team]
method = "blend"
sources = ["supervised"]

[decode]
method = "switch_cost"
turnover_cost = 5.0
stop_cost = 16.0
restart_cost = 12.0
snap_start_s = 3.0
snap_end_s = 3.0
line_snap_s = 6.0
line_margin_m = 0.5
