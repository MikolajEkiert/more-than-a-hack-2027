# Task 14 candidate: d_team_m6 (ball state of the temporal network + kick-off rule; team evidence
# of the LightGBM with the team-feature block, possession/team_features.py) with the decoder
# options of b_bundle_m6 (stoppage start snapped to the tracked ball's line exit within 6 s;
# stoppage plus restart cost 28).
name = "c14_best"

[ball_state]
method = "blend"
sources = ["sequence", "kickoff_wait"]

[team]
method = "blend"
sources = [{ method = "supervised", features = "v1+team" }]

[decode]
method = "switch_cost"
turnover_cost = 5.0
stop_cost = 16.0
restart_cost = 12.0
snap_start_s = 3.0
snap_end_s = 3.0
line_snap_s = 6.0
line_margin_m = 0.5
