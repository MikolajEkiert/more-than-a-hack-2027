# Unsupervised pipeline, second version: touch episodes bridged across completed passes, a
# decoder that switches at the first evidence of the new state, stoppage edges snapped to the
# ball gap, kick-off set-ups. Hand-set evidence parameters; costs chosen on the external matches
# under both label readings and both degradation profiles (docs/DECISIONS.md).
name = "unsup_v2"

[ball_state]
method = "stoppage_evidence"

[team]
method = "touch_episodes"

[decode]
method = "switch_cost"
turnover_cost = 5.0
stop_cost = 12.0
restart_cost = 12.0
snap_start_s = 3.0
snap_end_s = 3.0
