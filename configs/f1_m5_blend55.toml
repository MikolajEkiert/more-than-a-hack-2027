# Task 14, direction F1: M5 ball state (LightGBM and temporal network 0.5 / 0.5 + kick-off); team: both at 0.5 / 0.5.
# The temporal network is the committed one of task 13 (models/sequence/); nothing is trained here.
name = "f1_m5_blend55"

[ball_state]
method = "blend"
sources = ["supervised", "sequence", "kickoff_wait"]
weights = [0.5, 0.5, 1.0]

[team]
method = "blend"
sources = ["supervised", "sequence"]
weights = [0.5, 0.5]

[decode]
method = "switch_cost"
turnover_cost = 5.0
stop_cost = 12.0
restart_cost = 12.0
snap_start_s = 3.0
snap_end_s = 3.0
