# Task 14, direction F1: V1 ball state; team evidence: V1's LightGBM and the mixed-regime LightGBM at 0.5 / 0.5.
name = "f1_mixteam_v1"

[ball_state]
method = "blend"
sources = ["supervised", "kickoff_wait"]

[team]
method = "blend"
sources = ["supervised", { method = "supervised", regime = "mix_lf" }]
weights = [0.5, 0.5]

[decode]
method = "switch_cost"
turnover_cost = 5.0
stop_cost = 12.0
restart_cost = 12.0
snap_start_s = 3.0
snap_end_s = 3.0
