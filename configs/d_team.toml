# Task 14, team features: version 1 with the team evidence taken from the supervised model trained
# with the team feature block (possession/team_features.py: goal side, carry, temporal
# association, pressure, shape against the team's norm) appended to its features, feature set
# "v1+team" (possession/supervised.py). Trained exactly as version 1's model otherwise. The
# ball-state evidence, the kick-off rule and the decoder are version 1's.
name = "d_team"

[ball_state]
method = "blend"
sources = ["supervised", "kickoff_wait"]

[team]
method = "blend"
sources = [{ method = "supervised", features = "v1+team" }]

[decode]
method = "switch_cost"
turnover_cost = 5.0
stop_cost = 12.0
restart_cost = 12.0
snap_start_s = 3.0
snap_end_s = 3.0
