# Task 14: ball state from V1's LightGBM and the temporal network, weighted by ball visibility
# (tracked ball: [1.0, 0.0]; no ball: [0.0, 1.0]); team evidence and decoder of V1.
name = "gate_s10"

[ball_state]
method = "blend_by_ball"
sources = ["supervised", "sequence", "kickoff_wait"]
weights_seen = [1.0, 0.0, 1.0]
weights_unseen = [0.0, 1.0, 1.0]

[team]
method = "blend"
sources = ["supervised"]

[decode]
method = "switch_cost"
turnover_cost = 5.0
stop_cost = 12.0
restart_cost = 12.0
snap_start_s = 3.0
snap_end_s = 3.0
