# M6 of the family in docs/FUSION.md section 10: the ball-state evidence of the temporal network alone
# (possession/sequence.py, trained in the mixed ball regime), plus the kick-off rule. The team
# evidence stays that of version 1.
name = "hybrid_sequence"

[ball_state]
method = "blend"
sources = ["sequence", "kickoff_wait"]

[team]
method = "blend"
sources = ["supervised"]

[decode]
method = "switch_cost"
turnover_cost = 5.0
stop_cost = 12.0
restart_cost = 12.0
snap_start_s = 3.0
snap_end_s = 3.0
