# Task 19: version 4 with the temporal network averaged over training seeds [0], without the
# home/away-swapped view.
name = "t19_s1"

[ball_state]
method = "blend"
sources = [{ method = "sequence_ensemble", seeds = [0], tta = false }, "kickoff_wait"]

[team]
method = "blend"
sources = [{ method = "supervised", features = "v1+team" }]

[decode]
method = "switch_cost"
turnover_cost = 5.0
stop_cost = 16.0
restart_cost = 12.0
snap_start_s = 3.0
snap_end_s = 3.0
line_snap_s = 6.0
line_margin_m = 0.5
