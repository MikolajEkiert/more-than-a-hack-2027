# Task 14, direction F1: M6 ball state; team: V1's LightGBM, the mixed-regime LightGBM and the temporal network's team head, 1/3 each.
name = "f1_m6_tri"

[ball_state]
method = "blend"
sources = ["sequence", "kickoff_wait"]

[team]
method = "blend"
sources = ["supervised", { method = "supervised", regime = "mix_lf" }, "sequence"]
weights = [0.3333, 0.3333, 0.3333]

[decode]
method = "switch_cost"
turnover_cost = 5.0
stop_cost = 12.0
restart_cost = 12.0
snap_start_s = 3.0
snap_end_s = 3.0
