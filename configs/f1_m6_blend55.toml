# Task 14, direction F1: M6 ball state (temporal network + kick-off rule); team: LightGBM and team head at 0.5 / 0.5.
# The temporal network is the committed one of task 13 (models/sequence/); nothing is trained here.
name = "f1_m6_blend55"

[ball_state]
method = "blend"
sources = ["sequence", "kickoff_wait"]

[team]
method = "blend"
sources = ["supervised", "sequence"]
weights = [0.5, 0.5]

[decode]
method = "switch_cost"
turnover_cost = 5.0
stop_cost = 12.0
restart_cost = 12.0
snap_start_s = 3.0
snap_end_s = 3.0
