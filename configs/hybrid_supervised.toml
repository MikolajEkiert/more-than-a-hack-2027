# Hybrid found by the head-to-head of 2026-11-14 (docs/FUSION.md section 6): the supervised
# model's evidence for both stages, our formation-based kick-off rule, our decoder with the
# settings of unsup_v2 (not re-tuned). The model is the supervised track's package solution/,
# trained by the repository itself on open data (possession/supervised.py): the first run
# downloads 2.7 GB to .cache/idsse/ and trains; later runs load the cached model.
name = "hybrid_supervised"

[ball_state]
method = "blend"
sources = ["supervised", "kickoff_wait"]

[team]
method = "blend"
sources = ["supervised"]

[decode]
method = "switch_cost"
turnover_cost = 5.0
stop_cost = 12.0
restart_cost = 12.0
snap_start_s = 3.0
snap_end_s = 3.0
